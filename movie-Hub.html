<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Hub</title>
    <style>
        /* --- CSS Variables for Themes --- */
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --success-hover: #059669;
            --border-color: #e2e8f0;
            --header-bg: rgba(241, 245, 249, 0.9);
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border-color: #334155;
            --header-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* --- Header & Controls --- */
        .header {
            position: sticky;
            top: 0;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1400px;
        }

        .header h1 {
            font-size: 24px;
            text-transform: uppercase;
            background: linear-gradient(to right, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .utility-btns button {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .utility-btns button:hover {
            background: var(--bg-color);
        }

        .filter-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 900px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .filter-controls::-webkit-scrollbar {
            display: none;
        }

        .search-bar {
            flex: 1;
            min-width: 200px;
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 16px;
            outline: none;
        }

        .category-btn {
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }

        .category-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* --- Grid View --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* --- Card Styles --- */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border-color);
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        .card img {
            object-fit: cover;
            width: 100%;
            height: 150px;
            transition: transform 0.3s;
        }

        .card-content { padding: 15px; flex: 1; }
        .card .title { font-weight: bold; font-size: 16px; color: var(--text-main); margin-top: 5px; }
        .card .category-label { font-size: 12px; color: var(--primary); text-transform: uppercase; font-weight: 700; }

        /* --- Favorites Heart --- */
        .fav-star {
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(255, 255, 255, 0.9);
            border: none; border-radius: 50%;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer; z-index: 10;
            color: #cbd5e1; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        body.dark-mode .fav-star { background: rgba(30, 41, 59, 0.9); }
        .fav-star.active { color: #f59e0b; }
        #sentinel { height: 20px; margin: 20px 0; }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 768px) {
            .header { padding: 12px 15px; gap: 10px; }
            .header h1 { font-size: 20px; }
            .utility-btns button { padding: 6px 12px; font-size: 14px; }
            .filter-controls { flex-wrap: wrap; justify-content: center; padding-bottom: 5px; }
            .search-bar { width: 100%; min-width: unset; padding: 8px 15px; font-size: 14px; }
            .category-btn { padding: 8px 16px; font-size: 14px; }
            .grid-container { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin: 20px auto; padding: 0 15px; }
            .card img { height: 120px; }
            
            /* COMPACT MODAL HEADER FOR MOBILE */
            .modal-header {
                padding: 6px 8px;
                gap: 5px;
            }
            .modal-title {
                display: none; /* जगह बचाने के लिए मोबाइल में टाइटल हाईड किया गया है */
            }
            .server-btn, .modal-actions button {
                padding: 4px 8px !important;
                font-size: 11px !important;
                border-radius: 4px !important;
            }
            .modal-servers-wrapper { gap: 5px; }
            .modal-servers { gap: 4px; }
            .modal-actions { gap: 5px; }
        }

        /* --- Modal (Pop-up) --- */
        .modal-overlay {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(5px);
            z-index: 1000; justify-content: center; align-items: center;
        }

        .modal-overlay.show { display: flex; }
        
        .modal-content {
            width: 95%; height: 95%; background: var(--card-bg);
            border-radius: 12px; display: flex; flex-direction: column; overflow: hidden;
            transition: all 0.3s ease;
        }

        .modal-content.is-fullscreen {
            width: 100% !important; height: 100% !important; border-radius: 0 !important;
        }
        
        /* NEW COMPACT DESKTOP HEADER */
        .modal-header {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
            padding: 8px 12px; background: var(--bg-color); border-bottom: 1px solid var(--border-color); gap: 8px;
        }

        .modal-servers-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .modal-servers { display: flex; gap: 6px; flex-wrap: wrap; }
        
        .server-btn {
            background: var(--card-bg); color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 5px 10px; /* Reduced Padding */
            border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; /* Smaller Font */
            transition: all 0.2s; text-decoration: none; display: inline-block;
        }

        .server-btn:hover { background: var(--border-color); }
        .server-btn.active {
            background: var(--primary); color: white; border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
        }

        .new-tab-btn { background: var(--success); color: white !important; border-color: var(--success); }
        .new-tab-btn:hover { background: var(--success-hover) !important; border-color: var(--success-hover) !important; }

        .modal-actions { display: flex; align-items: center; gap: 6px; }
        .modal-actions button {
            color: #fff; border: none; padding: 5px 10px; /* Reduced Padding */
            cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 12px; /* Smaller Font */
        }
        
        .modal-title { margin-right: 10px; font-weight: 700; font-size: 14px; color: var(--text-main); }
        .btn-fullscreen { background: var(--primary); }
        .btn-close { background: var(--danger); }
        .modal-body { flex: 1; width: 100%; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="top-row">
            <h1>Movies Hub</h1>
            <div class="utility-btns">
                <button id="themeToggle" onclick="toggleTheme()">🌙 Dark Mode</button>
            </div>
        </div>
        <div class="filter-controls">
            <input type="text" id="searchInput" class="search-bar" placeholder="Search websites..." onkeyup="handleFilterChange()">
            <button class="category-btn active" onclick="filterCategory('All', this)">All</button>
            <button class="category-btn" onclick="filterCategory('Download Movies', this)">Download Movies</button>
            <button class="category-btn" onclick="filterCategory('Watch Movies', this)">Watch Movies</button>
            <button class="category-btn" style="color: #f59e0b;" onclick="filterCategory('Favs', this)">⭐ Favorites</button>
        </div>
    </div>

    <div class="grid-container" id="cardGrid"></div>
    <div id="sentinel"></div>

    <div class="modal-overlay" id="myModal">
        <div class="modal-content" id="modalContent">
            <div class="modal-header">
                
                <div class="modal-servers-wrapper">
                    <div class="modal-title" id="modalTitle"></div>
                    <div class="modal-servers" id="modalServersContainer"></div>
                    <a id="openNewTabBtn" href="#" target="_blank" class="server-btn new-tab-btn" style="display: none;">↗ Open in New Tab</a>
                </div>

                <div class="modal-actions">
                    <button class="btn-fullscreen" onclick="toggleFullScreen()">⛶ Full Screen</button>
                    <button class="btn-close" onclick="closeModal()">✖ Close</button>
                </div>
            </div>
            <div class="modal-body">
                <!-- allow-popups हटा दिया गया है ताकि फालतू ऐड्स नए टैब में ना खुलें -->
                <iframe id="webFrame" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
            </div>
        </div>
    </div>

    <script>
        const cardsData = [
            { id: 1, title: "HDHub4u", category: "Download Movies", imgUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToN7LqygycdFrdzhEDub4ri8jTWGm1_4_6Ww&s", siteUrls: ["https://hdhub4u.med/", "https://new1.hdhub4u.cl/?utm=mn1"] },
            { id: 2, title: "watch-movies", category: "Download Movies", imgUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToN7LqygycdFrdzhEDub4ri8jTWGm1_4_6Ww&s", siteUrls: ["https://www.watch-movies.com.pk/"] },
            { id: 3, title: "katworld", category: "Download Movies", imgUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToN7LqygycdFrdzhEDub4ri8jTWGm1_4_6Ww&s", siteUrls: ["https://katworld.net/", "https://moviesbaba.lol/"] },
            { id: 4, title: "4khdhub", category: "Watch Movies", imgUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToN7LqygycdFrdzhEDub4ri8jTWGm1_4_6Ww&s", siteUrls: ["https://4khdhub.one/"] },
            { id: 5, title: "filmyzilla", category: "Download Movies", imgUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToN7LqygycdFrdzhEDub4ri8jTWGm1_4_6Ww&s", siteUrls: ["https://www.filmyzilla40.com/"] },
            { id: 6, title: "movierulz", category: "Watch Movies", imgUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToN7LqygycdFrdzhEDub4ri8jTWGm1_4_6Ww&s", siteUrls: ["https://www.5movierulz.school/"] },
            { id: 7, title: "Gdrive movies", category: "Watch Movies", imgUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToN7LqygycdFrdzhEDub4ri8jTWGm1_4_6Ww&s", siteUrls: ["https://www.movieadda.fun/"] },
            { id: 8, title: "mp4hits", category: "Download Movies", imgUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToN7LqygycdFrdzhEDub4ri8jTWGm1_4_6Ww&s", siteUrls: ["https://mp4hits.com/"] },
            { id: 9, title: "filmzzo", category: "Download Movies", imgUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToN7LqygycdFrdzhEDub4ri8jTWGm1_4_6Ww&s", siteUrls: ["https://filmzzo.com/"] },
            { id: 10, title: "webshowtimes", category: "Watch Movies", imgUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToN7LqygycdFrdzhEDub4ri8jTWGm1_4_6Ww&s", siteUrls: ["https://webshowtimes.com/"] },
            { id: 11, title: "desicinemas", category: "Watch Movies", imgUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToN7LqygycdFrdzhEDub4ri8jTWGm1_4_6Ww&s", siteUrls: ["https://desicinemas.to/"] },
            { id: 12, title: "Filmy FLy", category: "Download Movies", imgUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToN7LqygycdFrdzhEDub4ri8jTWGm1_4_6Ww&s", siteUrls: ["https://argyllfilms.com/"] },
            { id: 13, title: "khatrimaza", category: "Download Movies", imgUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToN7LqygycdFrdzhEDub4ri8jTWGm1_4_6Ww&s", siteUrls: ["https://thekhatrimaza.soy/"] },
            { id: 14, title: "moviescounter", category: "Download Movies", imgUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToN7LqygycdFrdzhEDub4ri8jTWGm1_4_6Ww&s", siteUrls: ["https://moviescounter.boston/"] },
            { id: 15, title: "downloadhub", category: "Download Movies", imgUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToN7LqygycdFrdzhEDub4ri8jTWGm1_4_6Ww&s", siteUrls: ["https://www.downloadhub.christmas/"] },
            { id: 16, title: "Filmywap", category: "Download Movies", imgUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToN7LqygycdFrdzhEDub4ri8jTWGm1_4_6Ww&s", siteUrls: ["https://www.50filmywap.com/"] }
        ];

        let currentCategory = 'All';
        let filteredData = [...cardsData];
        let itemsToLoad = 12; 
        let currentRenderedCount = 0;
        
        let favoriteIds = JSON.parse(localStorage.getItem('hub_favorites')) || [];
        const grid = document.getElementById('cardGrid');

        function renderNextBatch() {
            const nextBatch = filteredData.slice(currentRenderedCount, currentRenderedCount + itemsToLoad);
            
            nextBatch.forEach(card => {
                const isFav = favoriteIds.includes(card.id);
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.onclick = () => openModal(card.siteUrls, card.title);

                cardEl.innerHTML = `
                    <button class="fav-star ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, ${card.id})">★</button>
                    <img src="${card.imgUrl}" alt="${card.title}" loading="lazy">
                    <div class="card-content">
                        <div class="category-label">${card.category}</div>
                        <div class="title">${card.title}</div>
                    </div>
                `;
                grid.appendChild(cardEl);
            });

            currentRenderedCount += nextBatch.length;
        }

        function handleFilterChange() {
            grid.innerHTML = '';
            currentRenderedCount = 0;
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            
            filteredData = cardsData.filter(card => {
                const matchesSearch = card.title.toLowerCase().includes(searchText);
                let matchesCategory = false;

                if (currentCategory === 'All') matchesCategory = true;
                else if (currentCategory === 'Favs') matchesCategory = favoriteIds.includes(card.id);
                else matchesCategory = card.category === currentCategory;

                return matchesSearch && matchesCategory;
            });
            renderNextBatch();
        }

        function filterCategory(category, btnElement) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            handleFilterChange();
        }

        function toggleFavorite(event, id) {
            event.stopPropagation(); 
            if (favoriteIds.includes(id)) {
                favoriteIds = favoriteIds.filter(favId => favId !== id);
                event.target.classList.remove('active');
            } else {
                favoriteIds.push(id);
                event.target.classList.add('active');
            }
            localStorage.setItem('hub_favorites', JSON.stringify(favoriteIds));
            if (currentCategory === 'Favs') handleFilterChange();
        }

        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('themeToggle');
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                themeBtn.innerText = "☀️ Light Mode";
                localStorage.setItem('hub_theme', 'dark');
            } else {
                themeBtn.innerText = "🌙 Dark Mode";
                localStorage.setItem('hub_theme', 'light');
            }
        }

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && currentRenderedCount < filteredData.length) {
                renderNextBatch();
            }
        }, { threshold: 1.0 });

        observer.observe(document.getElementById('sentinel'));

        const modalOverlay = document.getElementById('myModal');
        const webFrame = document.getElementById('webFrame');
        const modalContent = document.getElementById('modalContent');
        const modalTitle = document.getElementById('modalTitle');
        const modalServersContainer = document.getElementById('modalServersContainer');
        const openNewTabBtn = document.getElementById('openNewTabBtn');

        function openModal(urlsArray, title) {
            modalTitle.innerText = title;
            modalServersContainer.innerHTML = ''; 
            
            if (urlsArray && urlsArray.length > 0) {
                if (urlsArray.length > 1) {
                    urlsArray.forEach((url, index) => {
                        const btn = document.createElement('button');
                        btn.className = `server-btn ${index === 0 ? 'active' : ''}`;
                        btn.innerText = `Site ${index + 1}`;
                        
                        btn.onclick = () => switchSite(url, btn);
                        modalServersContainer.appendChild(btn);
                    });
                }
                
                webFrame.src = urlsArray[0];
                openNewTabBtn.href = urlsArray[0]; 
                openNewTabBtn.style.display = 'inline-block'; 
                
            } else {
                webFrame.src = ""; 
                openNewTabBtn.style.display = 'none'; 
            }

            modalOverlay.classList.add('show');
            document.body.style.overflow = 'hidden'; 
        }

        function switchSite(url, clickedBtn) {
            webFrame.src = url; 
            openNewTabBtn.href = url; 

            const allBtns = document.querySelectorAll('#modalServersContainer .server-btn');
            allBtns.forEach(btn => btn.classList.remove('active'));
            clickedBtn.classList.add('active');
        }

        function closeModal() {
            webFrame.src = ''; 
            modalOverlay.classList.remove('show');
            document.body.style.overflow = 'auto'; 
            
            modalContent.classList.remove('is-fullscreen');
            document.querySelector('.btn-fullscreen').innerHTML = "⛶ Full Screen";
            
            if (document.fullscreenElement) document.exitFullscreen();
        }

        function toggleFullScreen() {
            const btn = document.querySelector('.btn-fullscreen');
            
            modalContent.classList.toggle('is-fullscreen');
            
            if (modalContent.classList.contains('is-fullscreen')) {
                btn.innerHTML = "⛶ Exit Full Screen";
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch((err) => console.log(err));
                }
            } else {
                btn.innerHTML = "⛶ Full Screen";
                if (document.fullscreenElement && document.exitFullscreen) {
                    document.exitFullscreen().catch((err) => console.log(err));
                }
            }
        }

        window.onload = () => {
            if (localStorage.getItem('hub_theme') === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('themeToggle').innerText = "☀️ Light Mode";
            }
            handleFilterChange(); 
        };
    </script>
</body>
</html>
